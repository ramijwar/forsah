name: Ready-to-extract hosting ZIP
on:
  push:
    branches: ['arena/6064a944-forsah']
    paths:
      - 'deployment/hosting*'
      - 'deployment/INSTALL.txt'
      - 'scripts/package-hosting.py'
      - 'backend/**'
      - 'src/**'
      - 'scripts/check-assets.mjs'
      - 'scripts/browser-smoke.mjs'
      - 'scripts/build-original-reference.mjs'
      - 'public/**'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/hosting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosting:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, gd
          coverage: none
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/build-original-reference.mjs
      - run: python3 scripts/run-checked.py node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: artifacts/visual/
      - run: php -l deployment/hosting-auto.php && php -l backend/config-loader.php
      - run: python3 scripts/package-hosting.py
      - run: python3 scripts/run-checked.py python3 backend/tests/hosting.py
      - name: Install Apache for access-control verification
        run: sudo apt-get update -qq && sudo apt-get install -y apache2
      - run: python3 scripts/run-checked.py python3 backend/tests/hosting_apache.py
      - uses: actions/upload-artifact@v4
        with:
          name: forsah-hosting-ready
          path: |
            artifacts/forsah-hosting-ready.zip
            artifacts/forsah-hosting-fix.zip
            artifacts/forsah-ui-update.zip
          if-no-files-found: error
